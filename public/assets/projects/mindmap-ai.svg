<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101d"/>
      <stop offset="50%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <pattern id="grid5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg5)"/>
  <rect width="800" height="450" fill="url(#grid5)"/>
  
  <circle cx="680" cy="120" r="160" fill="#3b82f6" opacity="0.1" filter="blur(40px)"/>
  <circle cx="160" cy="360" r="140" fill="#f59e0b" opacity="0.08" filter="blur(40px)"/>
  
  <!-- Frame -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="45" rx="16" fill="rgba(0,0,0,0.4)"/>
  <circle cx="110" cy="82" r="6" fill="#ef4444"/>
  <circle cx="128" cy="82" r="6" fill="#f59e0b"/>
  <circle cx="146" cy="82" r="6" fill="#10b981"/>
  <text x="400" y="87" fill="#94a3b8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">mindmap-ai • Interactive AI Workspace</text>
  
  <!-- Content Showcase -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="rgba(59,130,246,0.15)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
    <text x="60" y="18" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">AI / DATA</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">MINDMAP AI</text>
    <text x="0" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Interactive AI-Powered Visual Idea Workspace</text>
    
    <!-- Tech stack pills -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="75" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="37" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">React</text>
      
      <rect x="85" y="0" width="65" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="117" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Vite</text>
      
      <rect x="160" y="0" width="105" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="212" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Canvas API</text>
      
      <rect x="275" y="0" width="115" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="332" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">AI Expansion</text>
      
      <rect x="400" y="0" width="95" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="447" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">JSON Export</text>
    </g>
  </g>
  
  <!-- Right Graphic Icon -->
  <g transform="translate(560, 160)">
    <circle cx="60" cy="60" r="55" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.25)" stroke-width="2"/>
    <circle cx="45" cy="50" r="10" fill="#60a5fa"/>
    <circle cx="75" cy="40" r="8" fill="#93c5fd"/>
    <circle cx="70" cy="75" r="9" fill="#93c5fd"/>
    <line x1="45" y1="50" x2="75" y2="40" stroke="#60a5fa" stroke-width="2"/>
    <line x1="45" y1="50" x2="70" y2="75" stroke="#60a5fa" stroke-width="2"/>
  </g>
</svg>

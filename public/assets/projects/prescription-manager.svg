<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d18"/>
      <stop offset="50%" stop-color="#24142d"/>
      <stop offset="100%" stop-color="#0f0a12"/>
    </linearGradient>
    <pattern id="grid8" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg8)"/>
  <rect width="800" height="450" fill="url(#grid8)"/>
  
  <circle cx="680" cy="120" r="160" fill="#ec4899" opacity="0.1" filter="blur(40px)"/>
  <circle cx="160" cy="360" r="140" fill="#f59e0b" opacity="0.08" filter="blur(40px)"/>
  
  <!-- Frame -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="45" rx="16" fill="rgba(0,0,0,0.4)"/>
  <circle cx="110" cy="82" r="6" fill="#ef4444"/>
  <circle cx="128" cy="82" r="6" fill="#f59e0b"/>
  <circle cx="146" cy="82" r="6" fill="#10b981"/>
  <text x="400" y="87" fill="#94a3b8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">prescription-manager • Firebase Healthcare</text>
  
  <!-- Content Showcase -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="135" height="28" rx="14" fill="rgba(236,72,153,0.15)" stroke="rgba(236,72,153,0.4)" stroke-width="1"/>
    <text x="67" y="18" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">FIREBASE CLOUD</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800">PRESCRIPTION MANAGER</text>
    <text x="0" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Digital Prescription Tracking &amp; Patient Records</text>
    
    <!-- Tech stack pills -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="95" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="47" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">JavaScript</text>
      
      <rect x="105" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="147" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Firebase</text>
      
      <rect x="200" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="242" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Firestore</text>
      
      <rect x="295" y="0" width="70" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="330" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">HTML5</text>
      
      <rect x="375" y="0" width="65" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="407" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">CSS3</text>
    </g>
  </g>
  
  <!-- Right Graphic Icon -->
  <g transform="translate(560, 160)">
    <circle cx="60" cy="60" r="55" fill="rgba(236,72,153,0.08)" stroke="rgba(236,72,153,0.25)" stroke-width="2"/>
    <path d="M48 40 H72 V80 H48 Z" fill="none" stroke="#f472b6" stroke-width="2.5" rx="3"/>
    <line x1="60" y1="52" x2="60" y2="68" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="60" x2="68" y2="60" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

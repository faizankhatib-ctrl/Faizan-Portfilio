<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081813"/>
      <stop offset="50%" stop-color="#0e2e24"/>
      <stop offset="100%" stop-color="#061410"/>
    </linearGradient>
    <pattern id="grid7" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg7)"/>
  <rect width="800" height="450" fill="url(#grid7)"/>
  
  <circle cx="680" cy="120" r="160" fill="#10b981" opacity="0.1" filter="blur(40px)"/>
  <circle cx="160" cy="360" r="140" fill="#f59e0b" opacity="0.08" filter="blur(40px)"/>
  
  <!-- Frame -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="45" rx="16" fill="rgba(0,0,0,0.4)"/>
  <circle cx="110" cy="82" r="6" fill="#ef4444"/>
  <circle cx="128" cy="82" r="6" fill="#f59e0b"/>
  <circle cx="146" cy="82" r="6" fill="#10b981"/>
  <text x="400" y="87" fill="#94a3b8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">moneta • Personal Finance Tracker</text>
  
  <!-- Content Showcase -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="135" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <text x="67" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">PYTHON / FLASK</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">MONETA FINANCE</text>
    <text x="0" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Full-Stack Ledger with PBKDF2 Auth &amp; Alerts</text>
    
    <!-- Tech stack pills -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="40" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Python</text>
      
      <rect x="90" y="0" width="70" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="125" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Flask</text>
      
      <rect x="170" y="0" width="105" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="222" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SQLAlchemy</text>
      
      <rect x="285" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="325" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SQLite</text>
      
      <rect x="375" y="0" width="95" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="422" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">PBKDF2</text>
    </g>
  </g>
  
  <!-- Right Graphic Icon -->
  <g transform="translate(560, 160)">
    <circle cx="60" cy="60" r="55" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)" stroke-width="2"/>
    <circle cx="60" cy="60" r="28" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <text x="60" y="68" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" text-anchor="middle">₹</text>
  </g>
</svg>

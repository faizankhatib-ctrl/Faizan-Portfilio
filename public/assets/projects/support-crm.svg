<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151e"/>
      <stop offset="50%" stop-color="#0b2434"/>
      <stop offset="100%" stop-color="#06121a"/>
    </linearGradient>
    <pattern id="grid6" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg6)"/>
  <rect width="800" height="450" fill="url(#grid6)"/>
  
  <circle cx="680" cy="120" r="160" fill="#0ea5e9" opacity="0.1" filter="blur(40px)"/>
  <circle cx="160" cy="360" r="140" fill="#f59e0b" opacity="0.08" filter="blur(40px)"/>
  
  <!-- Frame -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(14, 165, 233, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="45" rx="16" fill="rgba(0,0,0,0.4)"/>
  <circle cx="110" cy="82" r="6" fill="#ef4444"/>
  <circle cx="128" cy="82" r="6" fill="#f59e0b"/>
  <circle cx="146" cy="82" r="6" fill="#10b981"/>
  <text x="400" y="87" fill="#94a3b8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">support-crm • Customer Ticketing System</text>
  
  <!-- Content Showcase -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
    <text x="60" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">BACKEND / CRM</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">SUPPORTCRM</text>
    <text x="0" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Customer Support Ticketing &amp; Workflow System</text>
    
    <!-- Tech stack pills -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="42" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Node.js</text>
      
      <rect x="95" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="137" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Express</text>
      
      <rect x="190" y="0" width="105" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="242" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">PostgreSQL</text>
      
      <rect x="305" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="347" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Supabase</text>
      
      <rect x="400" y="0" width="75" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="437" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">React</text>
    </g>
  </g>
  
  <!-- Right Graphic Icon -->
  <g transform="translate(560, 160)">
    <circle cx="60" cy="60" r="55" fill="rgba(14,165,233,0.08)" stroke="rgba(14,165,233,0.25)" stroke-width="2"/>
    <rect x="38" y="38" width="44" height="44" rx="6" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="48" y1="52" x2="72" y2="52" stroke="#38bdf8" stroke-width="2"/>
    <line x1="48" y1="62" x2="65" y2="62" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>

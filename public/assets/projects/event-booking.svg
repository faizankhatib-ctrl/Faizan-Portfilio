<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08171d"/>
      <stop offset="50%" stop-color="#0e2a35"/>
      <stop offset="100%" stop-color="#061217"/>
    </linearGradient>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg4)"/>
  <rect width="800" height="450" fill="url(#grid4)"/>
  
  <circle cx="680" cy="120" r="160" fill="#06b6d4" opacity="0.1" filter="blur(40px)"/>
  <circle cx="160" cy="360" r="140" fill="#10b981" opacity="0.08" filter="blur(40px)"/>
  
  <!-- Frame -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="45" rx="16" fill="rgba(0,0,0,0.4)"/>
  <circle cx="110" cy="82" r="6" fill="#ef4444"/>
  <circle cx="128" cy="82" r="6" fill="#f59e0b"/>
  <circle cx="146" cy="82" r="6" fill="#10b981"/>
  <text x="400" y="87" fill="#94a3b8" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">eventbooking • FastAPI &amp; React Platform</text>
  
  <!-- Content Showcase -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
    <text x="65" y="18" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">FULL STACK</text>
    
    <text x="0" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800">EVENT BOOKING API</text>
    <text x="0" y="100" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">High-Performance Event Platform &amp; Ticket Engine</text>
    
    <!-- Tech stack pills -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="40" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">React</text>
      
      <rect x="90" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="130" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">FastAPI</text>
      
      <rect x="180" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="220" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Python</text>
      
      <rect x="270" y="0" width="90" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="315" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">MongoDB</text>
      
      <rect x="370" y="0" width="80" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="410" y="17" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Docker</text>
    </g>
  </g>
  
  <!-- Right Graphic Icon -->
  <g transform="translate(560, 160)">
    <circle cx="60" cy="60" r="55" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.25)" stroke-width="2"/>
    <rect x="35" y="42" width="50" height="36" rx="4" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="50" y1="42" x2="50" y2="78" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
</svg>

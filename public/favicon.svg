<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle glow border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Monogram FK with brackets -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle">
    <!-- Bracket Left -->
    <text x="14" y="41" font-size="20" fill="#f59e0b" fill-opacity="0.6">&lt;</text>
    <!-- FK Initials -->
    <text x="32" y="42" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">FK</text>
    <!-- Bracket Right -->
    <text x="50" y="41" font-size="20" fill="#f59e0b" fill-opacity="0.6">&gt;</text>
  </g>
</svg>